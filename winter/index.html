<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동계 야외 고객 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#FFFFFF;--surface:#F5F7FA;--line:#EBEDF0;--ink:#2F3238;--ink2:#5B5F66;--meta:#797E85;--accent:#FE5B1B;--accent-soft:#FFE9DF;
--good:#1B8A4B;--good-soft:#E6F4EC;--warn:#C76A00;--warn-soft:#FBF0E0;--bad:#C0392B;
--font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;
 padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 48px) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.gate{padding-top:20vh;display:flex;flex-direction:column;gap:16px}
.gate h1{font-size:24px;margin:0}
.gate p{color:var(--ink2);margin:0}
.err{color:var(--bad);font-size:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;min-height:48px}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px}
header.top{position:sticky;top:0;background:var(--bg);z-index:5;padding:14px 0 0}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who h1{font-size:20px;margin:0}
.who small{color:var(--meta);font-size:13px}
.who button{border:0;background:none;color:var(--meta);font-size:13px;padding:4px}
.prog{display:flex;gap:16px;margin:6px 0 10px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.prog b{color:var(--accent);font-size:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-size:16px;color:var(--meta);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{opacity:.72}
.chead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.chead b{font-size:16px}
.chead .tag{font-size:13px;color:var(--ink2);text-align:right}
.meta{font-size:14px;color:var(--ink2)}
.resv{display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.resv div{display:flex;justify-content:space-between;gap:8px}
.st{font-size:13px;font-weight:600;text-align:right}
.st.need{color:var(--warn)} .st.ok{color:var(--good)} .st.asked{color:var(--ink2)}
.fc{font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap}
.fc-bad{background:#FBE9E7;color:var(--bad)} .fc-mid{background:var(--warn-soft);color:var(--warn)} .fc-ok{background:var(--good-soft);color:var(--good)}
.linkbtn{border:0;background:none;color:var(--ink2);text-decoration:underline;font-size:13px;padding:4px 2px;min-height:32px}
.cand{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;width:100%;border:0;background:none;text-align:left;padding:4px 0;min-height:44px}
.crow .cname{font-weight:700;font-size:17px}
.crow .tag{color:var(--ink2);font-size:13px}
.crow .next{margin-left:auto;font-size:14px;font-weight:600;color:var(--warn)}
.crow .next.ok{color:var(--good)}
.card.exp{gap:14px}
.card.done:not(.exp){opacity:.72}
section.s{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
h3.step{display:flex;align-items:center;gap:8px;font-size:16px;margin:0}
h3.step .n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px}
h3.step .cnt{font-size:13px;color:var(--warn);font-weight:600}
.lab{font-size:14px;color:var(--ink2);margin:4px 0 0}
.rule{font-size:15px;color:var(--ink);margin:0}
details.more summary{font-size:14px;color:var(--ink2);cursor:pointer;min-height:40px;display:flex;align-items:center}
details.more summary::before{content:'▸';margin-right:6px}
details.more[open] summary::before{content:'▾'}
details.more summary::-webkit-details-marker{display:none}
.today{font-size:14px;color:var(--ink);margin:6px 0 2px;width:100%}
.slk,.maplink{display:inline-flex;align-items:center;min-height:40px;padding:0 4px;color:var(--ink2)}
.seg button,.btn.sm{min-height:44px}
.chip{min-height:40px}
.note{font-size:14px}
button.consent[aria-pressed="false"]{border-color:var(--accent);color:var(--accent)}
@media (max-width:420px){#acct{display:none}}
.tasks{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip.zero{color:var(--meta)}
details.script{background:var(--bg);border-radius:10px;padding:10px 12px}
details.script summary{font-weight:600;cursor:pointer;min-height:32px}
details.script ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details.script li.say{color:var(--ink)} details.script li.do{color:var(--ink2);font-size:14px;list-style:'→ '}
.cand .sub{margin:4px 0 0;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
.row>label.f{flex:1 1 140px}
label.f select,label.f input,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:16px;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:44px}
.mv{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.mv>span,.mvh{display:flex;justify-content:space-between;gap:8px}
.card .sub{font-size:14px;margin:4px 0 0;color:var(--ink2)}
.saved{font-size:13px;color:var(--good)}
.clue{background:var(--warn-soft);border-radius:8px;padding:10px;font-size:14px}
.clue ul{margin:6px 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.clue a{color:var(--ink);font-weight:600}
details.hist{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:14px}
details.hist summary{cursor:pointer;font-weight:600}
details.hist ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink2)}
.saved.err{color:var(--bad)}
.call{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:600;min-height:44px;font-size:16px}
.phone{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px;user-select:all}
.req{background:var(--bg);border-radius:8px;padding:10px;font-size:14px;color:var(--ink);border:1px solid var(--line)}
.empty{color:var(--meta);padding:24px 0;text-align:center}
details.guide{margin-top:12px;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
details.guide summary{font-weight:600;cursor:pointer}
details.guide ul{margin:8px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
.stopform{display:flex;flex-direction:column;gap:10px}
.sub{font-weight:600;margin:16px 0 0}
.note{font-size:13px;color:var(--meta)}
</style>
</head>
<body>
<div class="wrap">
  <section id="gate" class="gate" hidden>
    <h1>동계 야외 고객 관리</h1>
    <p>팀장님용 화면입니다. 회사 구글 계정(@thetrive.com)으로 로그인하면 우리 팀 고객만 보입니다.</p>
    <p class="note">카카오톡·네이버·인스타그램 앱 안에서 열면 구글 로그인이 막힐 수 있습니다. 화면 오른쪽 위(또는 아래) 메뉴에서 '다른 브라우저로 열기'를 눌러 크롬이나 사파리로 열어 주세요.</p>
    <button class="btn" id="login">회사 계정으로 로그인</button>
    <p id="gerr" class="err" hidden></p>
  </section>

  <section id="app" hidden>
    <header class="top">
      <div class="who"><h1 id="title">동계 야외 고객</h1><span><small id="acct"></small> <button id="logout">로그아웃</button></span></div>
      <div class="prog" id="prog"></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="t-cust" aria-selected="true">고객</button>
        <button role="tab" id="t-stop" aria-selected="false">기타 중단 기록</button>
        <button role="tab" id="t-guide" aria-selected="false">도움말</button>
      </div>
    </header>
    <div class="chips" id="teamchips"></div>
    <main id="view"></main>
    <p class="note" id="sync"></p>
  </section>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const API='https://tzxsjwkahzosmvmvpxxc.supabase.co/functions/v1/winter-outdoor';
if(/KAKAOTALK/i.test(navigator.userAgent)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);}
const SB=window.supabase.createClient('https://tzxsjwkahzosmvmvpxxc.supabase.co','sb_publishable_fmSMAvC9DqvA9EG41fC2HA_Qb_SpMOJ',{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD='일월화수목금토';
let D=null, TAB='cust', TEAM='all', BOOTED=false, TASK='', LOADED=0;
// OPEN: 날씨로 옮기려고 펼친 10·12·14시 예약, CAND: 예약별 옮길 수 있는 후보(서버가 회사 DB로 계산)
const OPEN=new Set(), CAND=new Map(); let EXP=0; // EXP: 펼친 고객 하나

function kstToday(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10);}
function fmtDate(ymd){if(!ymd)return '';const [y,m,d]=ymd.split('-').map(Number);const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return `${m}/${d}(${WD[w]})`;}
function fmtKst(k){return `${fmtDate(k.slice(0,10))} ${k.slice(11,13)}시`;}
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200);}

async function token(){const {data}=await SB.auth.getSession();return data.session?.access_token||'';}
async function api(action,extra={}){
  const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await token()},body:JSON.stringify({action,...extra})});
  const j=await r.json().catch(()=>({error:'서버 응답을 읽지 못했습니다'}));
  if(!r.ok||j.error)throw new Error(j.error||('오류 '+r.status));
  return j;
}

function showGate(msg){$('app').hidden=true;$('gate').hidden=false;$('gerr').textContent=msg||'';$('gerr').hidden=!msg;}
$('login').onclick=()=>SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{hd:'thetrive.com',prompt:'select_account'}}});
$('logout').onclick=async()=>{await SB.auth.signOut();showGate();};

async function enter(u){
  if(location.search.includes('code='))history.replaceState(null,'',location.pathname);
  if(BOOTED)return;BOOTED=true;
  $('gate').hidden=true;$('app').hidden=false;$('acct').textContent=u.email;
  await reload();
}
// 화면에 돌아올 때·부탁한 뒤에는 서버 기준으로 다시 그린다(다른 기기에서 바꾼 것·옮김 완료가 보이게). 실패하면 알림만
async function refresh(){
  try{D=await api('load');LOADED=Date.now();render();}catch(e){toast('새로 불러오지 못했습니다. 신호를 확인해 주세요');}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!D||Date.now()-LOADED<60000)return;
  if(document.activeElement&&document.activeElement.matches('textarea,input'))return;
  refresh();
});
async function reload(){
  try{D=await api('load');LOADED=Date.now();}catch(e){BOOTED=false;showGate(e.message);return;}
  $('title').textContent=D.me.isAdmin?'동계 야외 고객 (전체)':`${D.me.name} 팀장 · 동계 야외 고객`;
  const t=D.syncedAt?new Date(D.syncedAt):null;
  $('sync').textContent=t?`예약 정보는 06–22시에 30분마다 새로 받습니다. 차비스가 예약을 옮긴 뒤 '옮김 완료'로 바뀌기까지 최대 30분 걸립니다. 마지막: ${t.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`:'';
  render();
}
SB.auth.onAuthStateChange((ev,s)=>{const u=s?.user;if(u&&/@thetrive\.com$/i.test(u.email||''))enter(u);else if(u){SB.auth.signOut();showGate(`${u.email}은 회사 계정이 아닙니다`);}else if(ev==='SIGNED_OUT')showGate();});
(async()=>{const {data}=await SB.auth.getSession();const u=data.session?.user;if(u&&/@thetrive\.com$/i.test(u.email||''))enter(u);else if(!u)showGate();})();

// ── 데이터 묶기 ──
const callOf=uid=>D.calls.find(c=>+c.user_id===+uid)||{};
const LOGK={result:'통화 결과',parking:'주차 위치',sun:'해 드는 시간',indoor_move:'실내 이동',alt_intent:'대안 의향',memo:'메모'};
function logsOf(uid){return (D.callLogs||[]).filter(l=>+l.user_id===+uid).sort((a,b)=>String(b.at).localeCompare(String(a.at)));}
function kdt(t){const d=new Date(new Date(t).getTime()+9*3600e3);return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;}
function historyBox(c){
  const ls=logsOf(c.user_id);const rids=new Set(resvOf(c.user_id).map(r=>+r.rid));
  const st=(D.stops||[]).filter(s=>(s.rid&&rids.has(+s.rid))||(s.customer&&s.customer===c.name));
  if(!ls.length&&!st.length)return '';
  const lastRes=ls.find(l=>l.fields&&l.fields.result);
  const head=lastRes?`지난 통화 ${kdt(lastRes.at)} · ${esc(lastRes.fields.result)} · ${esc(lastRes.by_name||'')}`:`기록 ${ls.length}건`;
  const lines=ls.slice(0,15).map(l=>`<li>${kdt(l.at)} ${esc(l.by_name||'')} · ${Object.entries(l.fields||{}).map(([k,v])=>`${esc(LOGK[k]||k)} ${esc(v)}`).join(' · ')}</li>`).join('');
  const sl=st.map(s=>`<li>${fmtDate(s.wash_date)} 중단 · ${esc(s.reason)}${s.action?' → '+esc(s.action):''}</li>`).join('');
  return `<details class="hist"><summary>${head}${st.length?` · 중단 ${st.length}번`:''}</summary><ul>${lines}${sl}</ul></details>`;
}
const moveOf=rid=>D.moves.find(m=>+m.rid===+rid)||{};
function teamLabel(z){return `${z} ${D.leaders[z]||''}`;}
// 고객은 예약이 가장 많은 팀 하나에 속한다 → 다른 팀 테크니션 담당 예약에는 그 팀을 붙여 보여 준다
function techLabel(r){const c=D.customers.find(x=>+x.user_id===+r.user_id);return esc(r.tech)+(c&&r.team&&r.team!==c.team?` (${esc(r.team)} 담당)`:'');}
// 주차 유형이 비어 있지만 테크니션 기록상 야외인 주소
function lotLabel(l){return l==='빈칸(기록상 야외)'?'정보 없음 · 테크니션 기록상 야외':l==='확인 필요'?'정보 없음 · 실내/야외 확인 필요':l;}
function inTeam(c){return TEAM==='all'||c.team===TEAM;}
function custList(){
  const order={'컨시어지 케어':0,'구독':1,'패키지':2,'1회권':3};
  return D.customers.filter(c=>c.active&&inTeam(c)).sort((a,b)=>(a.team>b.team)-(a.team<b.team)||(pendingRebook(b.user_id).length>0)-(pendingRebook(a.user_id).length>0)||(b.n_move>0)-(a.n_move>0)||(order[a.ticket]-order[b.ticket])||String(a.first_kst).localeCompare(b.first_kst));
}
function resvOf(uid){return D.reservations.filter(r=>+r.user_id===+uid&&r.active).sort((a,b)=>a.kst.localeCompare(b.kst));}
// 'YYYY-MM-DD HH' 비교용 (r.kst는 'YYYY-MM-DD HH:mm', 목표 시각은 '10시')
const slotKey=(ymd,h)=>`${ymd} ${String(parseInt(h,10)).padStart(2,'0')}`;
// 부탁이 지금 예약·지금 고른 시각과 같은가(아니면 예전 부탁)
function asked(r){const m=moveOf(r.rid);return !!m.requested_at&&m.req_from_kst===r.kst&&m.req_hour===m.target_hour&&(m.req_date||null)===(m.target_date||null);}
function reqKey(r){const m=moveOf(r.rid);return m.req_hour?slotKey(m.req_date||r.orig_kst.slice(0,10),m.req_hour):null;}
// 부탁한 뒤 팀장이 날짜·시각을 다시 골랐나
function tgtChanged(m){return !!m.target_hour&&!!m.req_hour&&(m.req_hour!==m.target_hour||(m.req_date||null)!==(m.target_date||null));}
// 주차 유형 확인 고객이라도 통화에서 야외(지상 야외·필로티)를 확인했으면 바로 옮길 수 있다(서버도 같은 기준)
const OUTDOOR_ANS=['지상 야외','필로티'];
function outdoorOK(r){return !r.lot_check||OUTDOOR_ANS.includes(callOf(r.user_id).parking||'');}
const badHour=r=>![10,12,14].includes(+r.kst.slice(11,13))&&r.kst<'2027-03-01';
function needsMove(r){return !r.canceled&&(r.needs_move||(r.lot_check&&outdoorOK(r)&&badHour(r)));}
// 예보 판정(월·수 08:10 갱신). 옮긴 뒤에 나온 '불가'면 다시 연다
function fcOf(rid){return (D.forecasts||[]).find(f=>+f.rid===+rid);}
function fcBadge(r){const f=fcOf(r.rid);if(!f||!outdoorOK(r))return '';return ` <span class="fc fc-${f.verdict==='불가'?'bad':f.verdict==='애매'?'mid':'ok'}" title="${esc(f.detail)}">예보 ${esc(f.verdict)}</span>`;}
function fcReopen(r){const f=fcOf(r.rid);if(!f||f.verdict!=='불가'||r.canceled||!outdoorOK(r))return false;const m=moveOf(r.rid);return !m.requested_at||String(f.judged_at)>String(m.requested_at);}
// 상태는 단계 하나로 부른다: ① 시각 고르기 → ② 고객 동의 누르기 → ③ 차비스에게 부탁하기 → 차비스 처리 중 → 완료
function flow(r){const m=moveOf(r.rid);
  if(asked(r)){const h=(Date.now()-new Date(m.requested_at).getTime())/3600e3;return h>=3?['need',`차비스 ${Math.floor(h)}시간째 그대로 · 슬랙 확인`]:['asked','차비스 처리 중'];}
  if(m.target_hour&&m.consent_date)return ['need','③ 차비스에게 부탁하기'];
  if(m.target_hour)return ['need','② 고객 동의 누르기'];
  return ['need','① 시각 고르기'];}
function moveState(r){
  const m=moveOf(r.rid);const rk=reqKey(r);const ch=tgtChanged(m);
  if(r.canceled){if(r.rebook_rid)return ['ok','완료 · 다시 잡힘'];if(m.skip)return ['ok','다시 안 잡음'];return flow(r);}
  if(fcReopen(r)&&m.requested_at&&!ch&&!asked(r))return ['need','예보 불가 · ① 다른 날 고르기'];
  if(rk&&r.kst.slice(0,13)===rk&&!ch)return ['ok','완료'];
  if(m.requested_at&&!ch&&m.req_from_kst&&r.kst!==m.req_from_kst)return m.skip==='확인함'?['ok','다르게 옮겨짐 · 확인함']:['need','부탁과 다르게 바뀜 · 고객에게 알리기'];
  if(r.needs_move&&r.moved&&!m.requested_at)return ['ok','완료'];
  return flow(r);}
// 3에 칸을 보여 줄 예약: 08·16·18시(옮길 것) + 날씨로 펼쳤거나 고른 10·12·14시 + 예보 '불가'
function inPanel(r){if(r.canceled||!outdoorOK(r))return false;const m=moveOf(r.rid);
  return needsMove(r)||OPEN.has(+r.rid)||!!m.target_hour||!!m.requested_at||fcReopen(r);}
const isDone=r=>r.canceled?(!!r.rebook_rid||!!moveOf(r.rid).skip):moveState(r)[0]==='ok';
const pendingRebook=uid=>resvOf(uid).filter(r=>r.canceled&&!isDone(r));
const pendingOf=uid=>resvOf(uid).filter(r=>(r.canceled||inPanel(r))&&!isDone(r));

function renderProg(){
  const cs=custList();const called=cs.filter(c=>callOf(c.user_id).result==='통화함').length;
  const ids=new Set(cs.map(c=>+c.user_id));const mv=D.reservations.filter(r=>r.active&&needsMove(r)&&ids.has(+r.user_id));
  const done=mv.filter(r=>isDone(r)).length;
  $('prog').innerHTML=`<span>통화함 <b>${called}</b>/${cs.length}명</span><span>옮김 완료 <b>${done}</b>/${mv.length}건</span>`;
}
// 할 일 구분(누르면 그 일에 해당하는 고객만). 순서 = 급한 순서
const TASKS=[['rebook','결빙 취소 다시 잡기'],['fc','예보 불가'],['ready','부탁 전 예약'],['follow','차비스 확인 필요'],['call','첫 전화 남음'],['lot','주차 유형 확인']];
function taskOf(c,t){const rs=resvOf(c.user_id);const k=callOf(c.user_id);
  if(t==='call')return !k.result||k.result==='부재(다시 걸기)';
  if(t==='rebook')return rs.some(r=>r.canceled&&!isDone(r));
  if(t==='fc')return rs.some(r=>fcReopen(r)&&!isDone(r)&&!asked(r));
  if(t==='ready')return k.result==='통화함'&&rs.some(r=>(r.canceled||inPanel(r))&&!isDone(r)&&/①|②|③/.test(moveState(r)[1]));
  if(t==='follow')return rs.some(r=>/시간째 그대로|다르게 바뀜/.test(moveState(r)[1]));
  if(t==='lot')return c.lot==='확인 필요'&&!k.parking;
  return true;}
function nextOf(c){const k=callOf(c.user_id);
  for(const [t,l] of TASKS){if(t!=='call'&&t!=='lot'&&taskOf(c,t))return l;}
  if(taskOf(c,'call'))return k.result==='부재(다시 걸기)'?'다시 전화':'첫 전화';
  if(taskOf(c,'lot'))return '주차 유형 확인';
  const p=pendingOf(c.user_id);if(p.length)return moveState(p[0])[1];
  return '';}
function renderChips(){
  const teams=D.me.teams;const box=$('teamchips');
  const tc=teams.length<2?'':['all',...teams].map(z=>`<button class="chip" aria-pressed="${TEAM===z}" data-z="${z}">${z==='all'?'전체':esc(teamLabel(z))}</button>`).join('');
  const cnt=t=>custList().filter(c=>taskOf(c,t)).length;
  const counts=TASKS.map(([t,l])=>[t,l,cnt(t)]);
  const today=counts.filter(x=>x[2]).map(x=>`${x[1]} ${x[2]}`).join(' → ');
  const tasks=counts.map(([t,l,n])=>`<button class="chip${n?'':' zero'}" aria-pressed="${TASK===t}" data-task="${t}">${l} ${n}</button>`).join('');
  box.innerHTML=tc+(TAB==='cust'?`<p class="today">${today?`오늘 할 일(위에서부터): ${today}`:'지금 남은 할 일이 없습니다'}</p><div class="tasks">${tasks}</div>`:'');
  box.querySelectorAll('button[data-z]').forEach(b=>b.onclick=()=>{TEAM=b.dataset.z;render();});
  box.querySelectorAll('button[data-task]').forEach(b=>b.onclick=()=>{TASK=TASK===b.dataset.task?'':b.dataset.task;render();window.scrollTo(0,0);});
}
function render(){
  ['cust','stop','guide'].forEach(t=>$('t-'+t).setAttribute('aria-selected',TAB===t));
  renderChips();renderProg();
  const v=$('view');
  if(TAB==='cust')v.innerHTML=viewCust();
  else if(TAB==='stop')v.innerHTML=viewStop();
  else v.innerHTML=viewGuide();
  bind();
}
['cust','stop','guide'].forEach(t=>$('t-'+t).onclick=()=>{TAB=t;render();window.scrollTo(0,0);});

const OPT={
  result:['통화함','부재(다시 걸기)','거절','연락 안 됨(문자 보냄)'],
  parking:['','지상 야외','지하','필로티','기계식','모름'],

// 1주 뒤에도 못 할 때(확정 문서 대안 표): 컨시어지 탁송 / SA급 세차장(회사 부담, 고객이 직접 감) / 그 밖 1주 더 미룸

  if(c.car_class==='SA급')return ['','세차장 방문 동의','거절'];

}
function sel(name,opts,val,uid,label){return `<label class="f">${label}<select data-uid="${uid}" data-k="${name}">${opts.map(o=>`<option value="${esc(o)}" ${o===(val||'')?'selected':''}>${o?esc(o):'선택'}</option>`).join('')}</select></label>`;}
// 말로 읽는 시각: 16시 → 오후 4시
const SAY={8:'오전 8시',10:'오전 10시',12:'낮 12시',14:'오후 2시',16:'오후 4시',18:'오후 6시',20:'저녁 8시'};
const sayH=h=>SAY[+h]||`${+h}시`;
const sayK=k=>`${fmtDate(k.slice(0,10))} ${sayH(k.slice(11,13))}`;

// 빈 시각 후보: 같은 담당 먼저(칸), 담당을 바꿔도 된다고 하면 같은 팀 다른 담당(접힘). 같은 고객의 다른 예약이 이미 고른 칸은 뺀다
function candBox(r){
  const cd=CAND.get(+r.rid);const m=moveOf(r.rid);
  if(!cd||cd.loading)return '<p class="note">빈 시각을 찾는 중…</p>';
  if(cd.error)return `<p class="note">빈 시각을 못 불러왔습니다: ${esc(cd.error)} <button class="btn ghost sm" data-cand="${r.rid}">다시</button></p>`;
  const taken=new Set(resvOf(r.user_id).filter(x=>+x.rid!==+r.rid).map(x=>{const mm=moveOf(x.rid);return mm.target_hour?slotKey(mm.target_date||x.kst.slice(0,10),mm.target_hour)+'|'+(mm.new_tech_id||x.did||''):'';}));
  const pick=(d,h,did)=>m.target_date===d&&m.target_hour===h+'시'&&(+m.new_tech_id||0)===(+did||0);
  let sameL=cd.same,otherL=cd.other;
  if(r.canceled){const wk=Date.parse(r.kst.slice(0,10)+'T00:00:00Z')+7*864e5;const dist=x=>Math.abs(Date.parse(x.date+'T00:00:00Z')-wk);
    sameL=[...cd.same].sort((a,b)=>dist(a)-dist(b)||a.date.localeCompare(b.date));otherL=[...cd.other].sort((a,b)=>dist(a)-dist(b)||a.date.localeCompare(b.date));}
  const chip=(x,did,name)=>taken.has(slotKey(x.date,x.hour)+'|'+(did||r.did||''))?'':`<button data-pick="${r.rid}" data-d="${x.date}" data-h="${x.hour}" data-did="${did||''}" data-name="${esc(name||'')}" aria-pressed="${pick(x.date,x.hour,did)}">${fmtDate(x.date)} ${sayH(x.hour)}${name?' · '+esc(name):''}</button>`;
  const same=sameL.length?sameL.map(x=>chip(x)).join(''):'<span class="note">이 기간엔 지금 담당의 빈 시각이 없습니다. 아래 다른 담당을 보세요</span>';
  const other=otherL.length?otherL.map(x=>chip(x,x.did,x.name)).join(''):'<span class="note">빈 시각이 없습니다</span>';
  const otherOpen=!cd.same.length||!!m.new_tech_id;
  return `<p class="lab">지금 담당(${esc(r.tech)})의 빈 시각 · ${r.canceled?'1주 뒤에 가까운 날부터':'가까운 날부터'}</p><div class="seg">${same}</div>
    <details class="more" ${otherOpen?'open':''}><summary>담당을 바꿔도 된다고 하면: 같은 팀 다른 담당 빈 시각</summary><div class="seg">${other}</div></details>`;
}
function moveCtl(r){
  const m=moveOf(r.rid);const [cls,txt]=moveState(r);
  if(r.canceled&&isDone(r))return `<div class="mv"><div class="mvh"><span>취소된 ${fmtKst(r.kst)} · ${techLabel(r)}${r.rebook_rid?` → 새 예약 ${fmtKst(r.rebook_kst)}`:` · ${esc(m.skip)}`}</span><span class="st ${cls}">${txt}${m.skip?` <button class="linkbtn" data-unskip="${r.rid}">되돌리기</button>`:''}</span></div></div>`;
  if(isDone(r))return `<div class="mv"><div class="mvh"><span>${r.orig_kst!==r.kst?fmtKst(r.orig_kst)+' → ':''}${fmtKst(r.kst)} · ${techLabel(r)}</span><span class="st ${cls}">${txt}</span></div></div>`;
  if(/다르게 바뀜/.test(txt))return `<div class="mv"><div class="mvh"><span>${fmtKst(r.kst)} · ${techLabel(r)}</span><span class="st need">${txt}</span></div>
    <p class="note">고객이 동의한 ${fmtDate(m.req_date||'')} ${sayH(m.req_hour||'')}과 다르게 바뀌었습니다. 고객에게 지금 시각(${sayK(r.kst)})을 전화로 알리고 누르세요. <button class="btn ghost sm" data-ack="${r.rid}">고객에게 알림 · 확인함</button></p></div>`;
  const busy=asked(r);
  const defDate=r.canceled?(()=>{const d=new Date(Date.parse(r.kst.slice(0,10)+'T00:00:00Z')+7*864e5).toISOString().slice(0,10);return d<kstToday()?kstToday():d;})():r.kst.slice(0,10);
  const td=m.target_date||defDate;
  const head=r.canceled?`<p class="note">${r.canceled_kst?fmtKst(r.canceled_kst)+'에 ':''}회사 사정으로 취소된 회차(결빙·날씨 등). 세차권은 고객에게 돌아갔습니다. 1주 뒤 낮을 먼저 권합니다. <button class="btn ghost sm" data-skip="${r.rid}">다시 안 잡음</button></p>`
    :needsMove(r)?'':`<p class="note">날씨 때문에 옮길지 정하는 예약입니다${!m.target_hour?` <button class="btn ghost sm" data-close="${r.rid}">안 옮김(그대로 진행)</button>`:''}</p>`;
  const who=m.target_hour&&!m.new_tech_id?`<p class="lab">담당을 바꿔도 된다고 하셨나요?</p><div class="seg"><button data-flexv="0" data-rid2="${r.rid}" aria-pressed="${!m.tech_flex}">아니요(지금 담당)</button><button data-flexv="1" data-rid2="${r.rid}" aria-pressed="${!!m.tech_flex}">네(같은 팀 누구든)</button></div>`
    :m.new_tech_id?`<p class="note">담당: ${esc(r.tech)} → <b>${esc(m.new_tech)}</b> <button class="btn ghost sm" data-orig="${r.rid}">지금 담당으로 되돌리기</button></p>`:'';
  const con=m.target_hour?`<div class="seg"><button class="consent" data-consent="${r.rid}" aria-pressed="${!!m.consent_date}">${m.consent_date?`고객 동의함 (${fmtDate(m.consent_date)} 통화)`:'고객이 이 날짜·시각에 동의함'}</button></div>`:'';
  return `<div class="mv" data-mv="${r.rid}">
    <div class="mvh"><span>${r.canceled?'취소된 ':''}${fmtKst(r.kst)} · ${techLabel(r)}${r.canceled?'':fcBadge(r)}</span><span class="st ${cls}">${txt}</span></div>
    ${head}
    ${busy?'':candBox(r)}
    ${busy?'':`<details class="more"><summary>후보에 없는 시각 직접 넣기</summary><div class="row"><label class="f">${r.canceled?'새 예약 날짜':'옮길 날짜'}<input type="date" data-rid="${r.rid}" data-k="target_date" value="${esc(td)}" min="${kstToday()}" max="2027-03-14"></label>
    <div class="seg" role="group" aria-label="시각">${['10시','12시','14시'].map(h=>`<button data-rid="${r.rid}" data-hour="${h}" aria-pressed="${m.target_hour===h&&!m.new_tech_id}">${sayH(parseInt(h))}</button>`).join('')}</div></div></details>`}
    ${busy?'':who+con}
  </div>`;
}
// 4에 올릴 것: 동의까지 끝났고 아직 안 부탁한 것 / 동의가 빠진 것 / 부탁 후 오래 그대로인 것
function custReq(c){
  const rs=pendingOf(c.user_id);const ready=[],missing=[],stale=[];
  rs.forEach(r=>{const m=moveOf(r.rid);const st=moveState(r)[1];
    if(/다르게 바뀜/.test(st))return;
    if(asked(r)){if(moveState(r)[0]==='need')stale.push(r);return;}
    if(m.target_hour&&m.consent_date)ready.push(r);else missing.push(r);});
  return {ready,missing,stale};
}
function reqLine(r){const m=moveOf(r.rid);const to=`${fmtDate(m.target_date||r.kst.slice(0,10))} ${sayH(parseInt(m.target_hour))}`;
  return (r.canceled?`새 예약 ${to} (취소된 ${fmtKst(r.kst)} 대신)`:`${sayK(r.kst)} → ${to}`)+(m.new_tech_id?` · 담당 ${m.new_tech}로`:m.tech_flex?' · 담당 바꿔도 됨':' · 담당 그대로');}

// ── 고객별 전화 대본: 이름·팀장·예약 시각·빈 시각·상품별 질문을 채워서 보여 준다 ──
function sugg(r){const cd=CAND.get(+r.rid);if(!cd||!cd.same)return [];
  let xs=cd.same.slice();const base=r.kst.slice(0,10);
  if(needsMove(r)){const sd=xs.filter(x=>x.date===base);xs=[...sd,...xs.filter(x=>x.date!==base)];}
  if(r.canceled){const wk=new Date(Date.parse(base+'T00:00:00Z')+7*864e5).toISOString().slice(0,10);const later=xs.filter(x=>x.date>=wk);if(later.length)xs=later;}
  return xs.slice(0,2);}
function offer(r){const xs=sugg(r);if(!xs.length)return null;
  const allSame=xs.every(x=>x.date===r.kst.slice(0,10));
  const t=xs.map(x=>allSame?sayH(x.hour):`${fmtDate(x.date)} ${sayH(x.hour)}`);
  return {allSame,text:t.length===2?`${t[0]}나 ${t[1]}`:t[0],one:t.length===1};}
const Q=t=>`<li class="say">“${t}”</li>`;
const DO=t=>`<li class="do">${t}</li>`;
function scriptFor(c){
  const me=esc(D.me.isAdmin?(D.leaders[c.team]||'○○○'):D.me.name);const rs=resvOf(c.user_id);const k=callOf(c.user_id);
  const cx=rs.filter(r=>r.canceled&&!isDone(r)),mv=rs.filter(r=>inPanel(r)&&!isDone(r)&&!asked(r));
  const keep=rs.filter(r=>!r.canceled&&!inPanel(r)&&outdoorOK(r));
  const L=[];const blank='(빈 시각을 불러오는 중)';
  L.push(Q(`안녕하세요, ${esc(c.name)} 고객님. 카라멜 ${esc(c.team)}팀 팀장 ${me}입니다. 겨울 세차 일정 때문에 연락드렸어요.`));
  if(c.lot==='확인 필요'&&!OUTDOOR_ANS.includes(k.parking||'')){
    L.push(Q('차는 보통 지하 주차장에 세우세요, 아니면 지상에 세우세요?'));
    L.push(DO('지하·실내 → "실내는 지금처럼 진행해요. 아주 추운 날엔 미리 연락드릴 수 있어요." → 2에서 ①주차 위치 "지하". 여기서 끝'));
    L.push(DO('지상·야외 → 2에서 ①주차 위치 "지상 야외"를 고르면 아래 3에 옮길 예약이 생깁니다. 이어서 아래 대본'));
    L.push(DO('기계식이면 "실내 타워형인가요, 밖에 있는 기계식인가요?" → 실내면 지하, 밖이면 지상 야외'));}
  cx.forEach(r=>{const o=offer(r);L.push(Q(`${sayK(r.kst)} 세차는 그날 날씨 때문에 진행하지 못해서 죄송해요. 세차권은 그대로 돌려드렸고요, ${o?o.text+(o.one?' 괜찮으세요?':' 중에 편하신 때로 다시 잡아 드릴게요.'):blank}`));});
  if(cx.length)L.push(DO('취소 이유는 #caramel_실시간 알림을 보고 말합니다. 결빙이면 "차 표면에 물이 얼어서 닦으면 흠집이 생길 수 있어서요"'));
  const nm=mv.filter(needsMove),fc=mv.filter(r=>!needsMove(r));
  if(nm.length||!cx.length)L.push(Q('겨울에는 차 표면에 물이 얼면 닦아낼 수 없고, 억지로 닦으면 흠집이 생겨요. 그래서 2월까지 밖에 세워 두신 차는 낮 10시, 12시, 오후 2시에만 세차를 시작해요.'));
  nm.forEach(r=>{const o=offer(r);
    L.push(Q(!o?`${sayK(r.kst)} 예약을 같은 날 낮으로 옮겨 드리려고 하는데요, ${blank}`
      :o.allSame?`${sayK(r.kst)} 예약을 같은 날 ${o.text}${o.one?'로 옮겨 드려도 될까요?':' 중에 옮겨 드리려고 하는데 어느 쪽이 편하세요?'}`
      :`${sayK(r.kst)} 예약은 같은 날 낮이 차 있어서요, ${o.text}${o.one?' 괜찮으세요?':' 중에 괜찮으신 때 있으세요?'}`));});
  fc.forEach(r=>{const f=fcOf(r.rid);const o=offer(r);
    L.push(Q(`${sayK(r.kst)} 세차는 그날 ${f&&/눈/.test(f.detail)?'눈':'영하'} 예보가 있어서 차 표면이 얼 수 있어요. 그대로 두시면 당일 현장에서 최대한 해 보고, 원하시면 ${o?o.text:blank}로 옮겨 드릴 수 있어요. 어느 쪽이 편하세요?`));
    L.push(DO('그대로 두겠다고 하면 → 3에서 [안 옮김(그대로 진행)]'));});
  if(keep.length)L.push(Q(`${keep.slice(0,3).map(r=>sayK(r.kst)).join(', ')}${keep.length>3?` 외 ${keep.length-3}건`:''} 예약은 지금 시간 그대로 진행해요.`));
  L.push(Q('다만 영하로 내려가거나 눈이 오면 못 할 수 있어요. 그 주에 날씨를 보고 미리 연락드릴게요.'));
  if(!k.parking&&c.lot!=='확인 필요')L.push(DO('물어보기: 차를 어디에 세우는지 → 2의 ①주차 위치'));
  if(altOpts(c)&&!k.alt_intent){
    if(c.ticket==='컨시어지 케어')L.push(Q('혹시 1주 뒤에도 날씨 때문에 못 하게 되면, 저희가 차를 옮겨서 실내에서 해 드려도 될까요? 비용은 저희가 부담해요.')+DO('답은 2의 ③'));
    else L.push(Q('혹시 1주 뒤에도 날씨 때문에 못 하게 되면, 저희가 세차장을 잡아 둘 테니 직접 오셔서 기다려 주실 수 있을까요? 비용은 저희가 부담해요.')+DO('답은 2의 ③'));}
  if(cx.length||mv.length)L.push(c.ticket==='컨시어지 케어'?Q('바뀐 일정은 지금 말씀드린 날짜·시각으로 확정해 두겠습니다.')+DO('컨시어지는 카카오톡 알림이 안 가니 통화에서 확정')
    :Q('바뀐 일정은 카카오톡 「예약 확정 안내」로 받으실 거예요.'));
  L.push(DO('통화가 끝나면: 2 통화 결과 → 3 고객이 고른 시각 누르기 → 동의 → 4 [차비스에게 부탁하기]'));
  return `<details class="script" ${k.result==='통화함'?'':'open'}><summary>이 고객 전화 대본</summary><ul>${L.join('')}</ul>
    <p class="note">하지 않는 말: "밖에서 세차 안 해요" · "겨울엔 원래 못 해요" · 가 보기 전에 "아마 못 할 거예요" · "날씨 상관없이 해 드릴게요"</p></details>`;
}
const step=(n,t,extra='')=>`<h3 class="step"><span class="n">${n}</span>${t}${extra}</h3>`;
function cardBody(c){
  const k=callOf(c.user_id);const rs=resvOf(c.user_id);const called=k.result==='통화함';
  const cx=rs.filter(r=>r.canceled);const mv=rs.filter(inPanel);
  const keepRs=rs.filter(r=>!r.canceled&&!inPanel(r));
  const q=custReq(c);const open=pendingOf(c.user_id);
  const lotWait=c.lot==='확인 필요'&&!OUTDOOR_ANS.includes(k.parking||'');
  // 1 전화
  const s1=`${step(1,'전화')}
    <div class="meta">${esc(c.cars)}<br>${esc(c.building||'건물명 없음')} · 주차 ${esc(lotLabel(c.lot))}</div>
    ${c.lot==='확인 필요'?`<div class="clue"><b>주차 유형 확인 필요</b> · 전화 전에 짐작해 보세요<ul>
      <li>주소: ${esc(c.addr||'없음')} ${c.addr?`<a class="maplink" href="https://map.naver.com/p/search/${encodeURIComponent(c.addr)}" target="_blank" rel="noopener">네이버지도</a>`:''}</li>
      <li>고객 주차 메모: ${esc(c.park_memo||'없음')}</li><li>지난 해피콜 주차 기록: ${esc(c.hp_parking||'없음')}</li><li>같은 건물 다른 고객: ${esc(c.same_bldg||'없음')}</li></ul></div>`:''}
    ${historyBox(c)}
    ${scriptFor(c)}
    <div class="row"><a class="call" href="tel:${esc(String(c.phone).replace(/-/g,''))}">전화 걸기</a><span class="phone">${esc(c.phone)}</span></div>`;
  // 2 통화 결과
  const alt=altOpts(c);
  const s2=`${step(2,'통화 결과')}
    <div class="seg" role="group" aria-label="통화 결과">${OPT.result.map(o=>`<button data-uid="${c.user_id}" data-res="${esc(o)}" aria-pressed="${k.result===o}">${esc(o)}</button>`).join('')}</div>
    ${k.result==='부재(다시 걸기)'?'<p class="note">1시간 뒤 한 번 더 → 그래도 안 받으면 "전화드렸는데 연결이 안 돼서요, 편하실 때 연락 주세요" 문자 → \'연락 안 됨(문자 보냄)\'</p>':''}
    <div class="row">${sel('parking',OPT.parking,k.parking,c.user_id,'①주차 위치')}
    ${alt?sel('alt_intent',alt,k.alt_intent,c.user_id,'③1주 뒤도 못 하면 (회사 부담)'):'<p class="note" style="flex:1 1 140px">③1주 뒤도 못 하면: 1주 더 미룸</p>'}</div>
    <label class="f">메모 (칸 밖을 누르면 저장)<textarea data-uid="${c.user_id}" data-k="memo" rows="1">${esc(k.memo||'')}</textarea></label>
    <span class="saved" id="s${c.user_id}" ${k.updated_at?'':'hidden'}>${k.updated_at?'저장됨 '+new Date(k.updated_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</span>`;
  // 3 예약 정하기
  const keepHtml=keepRs.length?`<details class="more"><summary>시간은 괜찮은 예약 ${keepRs.length}건 (이미 10·12·14시)</summary><div class="resv">${keepRs.map(r=>`<div><span>${fmtKst(r.kst)} · ${techLabel(r)}${fcBadge(r)}</span><span class="st ok">${outdoorOK(r)?`<button class="linkbtn" data-open="${r.rid}">날씨로 옮기기</button>`:'그대로'}</span></div>`).join('')}</div>
    <p class="note">예보가 '애매'이거나 고객이 날을 바꾸고 싶어 하면 [날씨로 옮기기]</p></details>`:'';
  let s3body='';
  if(lotWait&&rs.some(r=>r.lot_check&&badHour(r)))s3body+=`<p class="note">이 고객의 ${rs.filter(r=>r.lot_check&&badHour(r)).map(r=>sayK(r.kst)).join(', ')} 예약은 주차 위치를 확인한 뒤 정합니다. 2에서 ①주차 위치를 "지상 야외"로 고르면 여기서 바로 옮길 수 있습니다.</p>`;
  if(!called&&open.length)s3body+=`<p class="note">2에서 '통화함'을 누르면 시각을 고를 수 있습니다.</p>${open.map(r=>`<div class="mvh"><span>${r.canceled?'취소된 ':''}${fmtKst(r.kst)} · ${techLabel(r)}${r.canceled?'':fcBadge(r)}</span><span class="st need">${r.canceled?'다시 잡을 예약':'옮길 예약'}</span></div>`).join('')}${[...cx,...mv].filter(isDone).map(moveCtl).join('')}`;
  else s3body+=[...cx,...mv].map(moveCtl).join('');
  if(open.length&&c.ticket==='컨시어지 케어')s3body+='<p class="note">컨시어지는 옮겨도 카카오톡 알림이 안 갑니다. 통화에서 날짜·시각을 확정하세요.</p>';
  const s3=(cx.length||mv.length||keepRs.length||s3body)?`${step(3,'예약 정하기',open.length?` <span class="cnt">${open.length}건 남음</span>`:'')}${s3body||(keepRs.length?'<p class="note">옮길 예약이 없습니다.</p>':'')}${keepHtml}`:'';
  // 4 차비스에게 부탁
  let s4='';
  const links=open.filter(asked).map(r=>moveOf(r.rid).slack_ts).filter(Boolean).map((ts,i,a)=>`<a class="slk" href="https://trydrive.slack.com/archives/C0A9F7H5M0E/p${String(ts).replace('.','')}" target="_blank" rel="noopener">슬랙 글${a.length>1?' '+(i+1):''} 열기</a>`).join(' ');
  if(called&&(q.ready.length||q.stale.length||links)){
    s4=step(4,'차비스에게 부탁');
    if(q.ready.length)s4+=`<div class="req">${q.ready.map(r=>esc(reqLine(r))).join('<br>')}</div>
      <div class="row"><button class="btn" data-ask="${c.user_id}">차비스에게 부탁하기 (${q.ready.length}건)</button></div>
      <p class="rule">#caramel_팀장 글 스레드의 차비스 카드에서 [실행]. '그래도 실행' 버튼만 있으면 [안 함] 누르고 고객에게 다시 전화</p>
      <details class="more"><summary>자세히</summary><p class="note">예약마다 글이 하나씩 올라갑니다. 팀장님이 [실행]을 안 누르면 운영팀이 12·15·18시에 처리합니다. 누르지 않는 버튼: [겹쳐도 실행]·[휴무여도 실행]·[근무시간 밖이어도 실행]·[상한 넘겨 실행].${q.missing.length?` 동의를 안 누른 ${q.missing.length}건은 이번에 빠집니다.`:''}</p></details>`;
    if(q.stale.length)s4+=`<div class="row"><button class="btn ghost" data-ask="${c.user_id}" data-again="1">차비스에게 다시 부탁하기 (${q.stale.length}건)</button></div>
      <p class="note">다시 부탁하기 전에 슬랙의 예전 차비스 카드에 [안 함]을 눌러 주세요. 두 카드가 다 실행되면 고객에게 알림이 두 번 갑니다.</p>`;
    if(links)s4+=`<div class="row">${links}</div>`;
  }
  return `<section class="s">${s1}</section><section class="s">${s2}</section>${s3?`<section class="s">${s3}</section>`:''}${s4?`<section class="s">${s4}</section>`:''}`;
}

  <li>위 칩을 눌러 할 일별로 고객을 봄 → 고객 이름 줄을 누르면 그 고객 카드만 펼쳐짐</li>
  <li><b>1 전화</b>: 이 고객 전화 대본(이름·시각·빈 시각이 채워져 있음) → [전화 걸기]</li>
  <li><b>2 통화 결과</b>: 통화함·부재·거절·연락 안 됨 → ①주차 위치 → (컨시어지·SA급만) ③1주 뒤도 못 하면 → 메모</li>
  <li><b>3 예약 정하기</b>: 고객이 고른 빈 시각 누르기 → 담당 바꿔도 되는지 → '고객이 이 날짜·시각에 동의함'</li>
  <li><b>4 차비스에게 부탁</b>: [차비스에게 부탁하기] → #caramel_팀장 글 스레드의 차비스 카드에서 [실행]. 30분 안에 '완료'</li></ul></details>
  <details class="guide"><summary>원칙과 하지 않는 말</summary><ul>
  <li>지금부터 2/28까지 야외 주차 세차는 10·12·14시 시작으로만</li>
  <li>"겨울엔 밖에서 세차 안 해요"로 끝내지 않기. 항상 다른 날짜·방법 제안</li>
  <li>날씨와 상관없이 다 된다고 약속하지 않기</li>
  <li>고객 연락은 담당 팀장 한 사람이</li>
  <li>하지 않는 말: "밖에서 세차 안 해요" · "겨울엔 원래 못 해요" · 이유 없이 "추워서 안 돼요" · 가 보기 전에 "아마 못 할 거예요" · "날씨 상관없이 해 드릴게요"</li></ul></details>
  <details class="guide"><summary>테크니션이 멈춘 뒤 전화</summary><ul>
  <li>멈출지는 현장 테크니션이 정함. 팀장은 그 판단을 뒤집지 않음</li>
  <li>고객은 "카라멜 사정으로 취소" 알림톡을 먼저 받은 상태. 이유는 #caramel_실시간 알림을 보고 말함</li>
  <li>"오늘 ○시 세차는 차 표면에 물이 얼어서, 닦으면 흠집이 생길 수 있어 진행하지 못했어요. 죄송합니다. 세차권은 그대로 돌려드렸고요, 다음 주 ○일 낮 ○시 어떠세요?"</li>
  <li>바닥이 이유면: "차는 괜찮은데, 세차 물이 바닥에 얼면 다른 분들이 미끄러질 수 있어서요"</li>
  <li>그 뒤: 카드 3에서 1주 뒤 빈 시각 → 동의 → 4 부탁. 고객이 다른 날을 원하지 않으면 [다시 안 잡음]에 이유를 적음</li></ul></details>
  <details class="guide"><summary>자주 묻는 질문</summary><ul>
  <li><b>어떤 고객이 나오나요?</b> 오늘부터 2/28까지 예약이 있고, 주차 위치가 야외로 등록됐거나 비어 있는 고객입니다(법인 제외). 비어 있는 고객은 실내·야외만 확인하면 되고, 통화에서 "지상 야외"를 고르면 그 자리에서 옮길 수 있습니다.</li>
  <li><b>우리 팀이 아닌 테크니션 예약이 왜 있나요?</b> 고객은 예약이 가장 많은 팀 하나에 들어갑니다. 한 번 통화로 그 고객 예약을 모두 정리하려는 것입니다. 다른 팀 담당 예약에는 "(Z3 담당)"처럼 붙습니다.</li>
  <li><b>빈 시각은 어떻게 고른 건가요?</b> 그 예약 날짜 6일 전부터 13일 뒤까지 10·12·14시 중, 근무시간 안이고 휴무·차단이 없고 다른 예약과 안 겹치는 칸입니다. 카드를 펼칠 때 회사 DB에서 바로 셉니다. 차비스가 실행 직전에 다시 확인합니다.</li>
  <li><b>담당을 바꿔도 되나요?</b> 고객이 괜찮다고 하면 됩니다. "담당을 바꿔도 된다고 하면" 아래 칸을 고르거나, "네(같은 팀 누구든)"를 누릅니다.</li>
  <li><b>동의를 눌렀는데 풀렸어요.</b> 날짜나 시각을 바꾸면 동의가 지워집니다. 바뀐 시각으로 다시 동의를 받고 누릅니다.</li>
  <li><b>차비스 카드는 누가 누르나요?</b> 팀장님이 [실행]을 누르면 바로 옮겨지고, 고객에게 카카오톡 「예약 확정 안내」가 갑니다(컨시어지 제외). 안 누르면 운영팀이 12·15·18시에 처리합니다. '그래도 실행' 버튼만 있으면 누르지 않고 [안 함] 후 고객에게 다시 전화합니다.</li>
  <li><b>'완료'는 언제 바뀌나요?</b> 차비스가 옮긴 뒤 다음 갱신 때 바뀝니다(06–22시 30분마다). 그 전까지는 '차비스 처리 중'입니다.</li>
  <li><b>잘못 부탁했어요.</b> 실행 전이면 카드에 [안 함]. 이미 옮겨졌으면 그 글 스레드에 "@차비스 예약 ○○번 ○/○ ○시로 다시 옮겨줘"처럼 예약 번호와 시각을 적고, 고객에게 전화로 알립니다.</li>
  <li><b>결빙과 상관없는 취소가 '다시 잡기'에 떠요.</b> 회사 사정 취소는 결빙·우천을 DB에서 구분할 수 없어 함께 뜹니다. 다시 잡을 필요가 없으면 [다시 안 잡음]에 이유를 적습니다.</li>
  <li><b>고객이 다른 날도 원하지 않으면요?</b> 다시 잡을 예약이면 [다시 안 잡음]에 "고객이 원하지 않음". 남은 예약을 취소해야 하면 팀장 앱에서 「카라멜 과실 취소」 + 상세 "[결빙]"으로 하고, 그 예약이 다시 잡기 목록에 뜨면 [다시 안 잡음]을 누릅니다.</li>
  <li><b>위 숫자는 뭔가요?</b> '통화함 3/12명'은 통화 결과를 '통화함'으로 남긴 고객 수, '옮김 완료 2/9건'은 08·16·18시 예약 중 낮으로 옮겨진 수입니다.</li>
  <li><b>다른 휴대폰에서 바꾼 게 안 보여요.</b> 다른 앱에 갔다 오면 새로 불러옵니다. 그래도 그대로면 새로고침합니다.</li></ul></details>`;
}

// ── 저장 ──
async function saveCall(uid,fields){
  const el=$('s'+uid);if(el){el.hidden=false;el.className='saved';el.textContent='저장 중…';}
  try{const j=await api('saveCall',{user_id:uid,fields});const i=D.calls.findIndex(c=>+c.user_id===+uid);if(i>=0)D.calls[i]={...D.calls[i],...j.row};else D.calls.push(j.row);if(j.log){(D.callLogs=D.callLogs||[]).push(j.log);}
    if(el)el.textContent='저장됨';renderProg();return true;}
  catch(e){if(el){el.className='saved err';el.textContent='저장 안 됨: '+e.message;}toast('저장 안 됨. 다시 눌러 주세요');return false;}
}
async function loadCand(rid){
  CAND.set(rid,{loading:true});render();
  try{const j=await api('candidates',{rid});CAND.set(rid,j);}catch(e){CAND.set(rid,{error:e.message});}
  render();
}
async function saveMove(rid,fields,rerender=true){
  try{const j=await api('saveMove',{rid,fields});const i=D.moves.findIndex(m=>+m.rid===+rid);const merged={...(i>=0?D.moves[i]:{}),...j.row};if(i>=0)D.moves[i]=merged;else D.moves.push(merged);if(rerender)render();}
  catch(e){toast('저장 안 됨: '+e.message);}
}
function bind(){
  const v=$('view');
  v.querySelectorAll('button[data-res]').forEach(b=>b.onclick=async()=>{const uid=+b.dataset.uid;const res=b.dataset.res;
    const grp=[...b.parentElement.querySelectorAll('button')];const before=grp.map(x=>x.getAttribute('aria-pressed'));const card=b.closest('.card');const wasDone=card.classList.contains('done');
    grp.forEach(x=>x.setAttribute('aria-pressed',x===b));card.classList.toggle('done',res==='통화함');
    if(await saveCall(uid,{result:res,called_at:new Date().toISOString()}))render();
    else{grp.forEach((x,i)=>x.setAttribute('aria-pressed',before[i]));card.classList.toggle('done',wasDone);}});
  v.querySelectorAll('select[data-uid],textarea[data-uid]').forEach(el=>el.onchange=async()=>{const ok=await saveCall(+el.dataset.uid,{[el.dataset.k]:el.value});
    if(ok&&el.dataset.k==='parking'){render();for(const r of pendingOf(+el.dataset.uid))if(!CAND.get(+r.rid)&&!asked(r))await loadCand(+r.rid);}});
  v.querySelectorAll('input[data-rid]').forEach(el=>el.onchange=()=>saveMove(+el.dataset.rid,{[el.dataset.k]:el.value}));
  // 시각을 고르는 것과 고객 동의는 따로 누른다(날짜·시각을 바꾸면 서버가 동의를 지운다)
  v.querySelectorAll('button[data-hour]').forEach(b=>b.onclick=()=>{const rid=+b.dataset.rid;const box=b.closest('.mv');
    const td=box.querySelector('input[data-k="target_date"]').value;
    saveMove(rid,{target_hour:b.dataset.hour,target_date:td});});
  v.querySelectorAll('button[data-consent]').forEach(b=>b.onclick=()=>{const rid=+b.dataset.consent;
    saveMove(rid,{consent:b.getAttribute('aria-pressed')!=='true'});});
  // 날씨로 옮기기: 10·12·14시 예약에 옮기기 칸을 펼치고 후보를 바로 부른다
  v.querySelectorAll('button[data-open]').forEach(b=>b.onclick=()=>{const rid=+b.dataset.open;OPEN.add(rid);render();loadCand(rid);});
  // 고객 줄을 누르면 그 고객 하나만 펼치고, 남은 예약의 빈 시각을 바로 불러온다
  v.querySelectorAll('button[data-exp]').forEach(b=>b.onclick=async()=>{const uid=+b.dataset.exp;EXP=EXP===uid?0:uid;render();
    if(!EXP)return;const el=$('c'+uid);if(el)el.scrollIntoView({block:'start'});
    for(const r of pendingOf(uid))if(!CAND.get(+r.rid)&&!asked(r))await loadCand(+r.rid);});
  v.querySelectorAll('button[data-ack]').forEach(b=>b.onclick=()=>saveMove(+b.dataset.ack,{skip:'확인함'}));
  v.querySelectorAll('button[data-flexv]').forEach(b=>b.onclick=()=>saveMove(+b.dataset.rid2,{tech_flex:b.dataset.flexv==='1'}));
  v.querySelectorAll('button[data-skip]').forEach(b=>b.onclick=()=>{const why=prompt('다시 안 잡는 이유를 짧게 적어 주세요 (예: 고객이 원하지 않음)');if(why&&why.trim())saveMove(+b.dataset.skip,{skip:why.trim()});});
  v.querySelectorAll('button[data-unskip]').forEach(b=>b.onclick=()=>saveMove(+b.dataset.unskip,{skip:null}));
  v.querySelectorAll('button[data-close]').forEach(b=>b.onclick=()=>{OPEN.delete(+b.dataset.close);render();});
  v.querySelectorAll('button[data-cand]').forEach(b=>b.onclick=()=>loadCand(+b.dataset.cand));
  v.querySelectorAll('button[data-candall]').forEach(b=>b.onclick=async()=>{const uid=+b.dataset.candall;
    const rs=resvOf(uid).filter(r=>(inPanel(r)||r.canceled)&&!isDone(r)&&!(r.needs_move&&r.moved)&&!CAND.get(+r.rid));
    for(const r of rs)await loadCand(+r.rid);});
  // 후보 칸을 누르면 그 날짜·시각(·담당)으로 정한다. 날짜·시각이 바뀌면 서버가 동의를 지운다
  v.querySelectorAll('button[data-pick]').forEach(b=>b.onclick=()=>{const did=b.dataset.did?+b.dataset.did:null;
    saveMove(+b.dataset.pick,{target_date:b.dataset.d,target_hour:b.dataset.h+'시',new_tech_id:did,new_tech:did?b.dataset.name:null});});
  v.querySelectorAll('button[data-flex]').forEach(b=>b.onclick=()=>saveMove(+b.dataset.flex,{tech_flex:b.getAttribute('aria-pressed')!=='true'}));
  v.querySelectorAll('button[data-orig]').forEach(b=>b.onclick=()=>saveMove(+b.dataset.orig,{new_tech_id:null}));
  // 중단 기록 → 그 예약의 옮기기 칸으로(다시 잡은 날짜가 있으면 날짜를 미리 넣어 둔다)
  v.querySelectorAll('button[data-stopmove]').forEach(b=>b.onclick=async()=>{const rid=+b.dataset.stopmove;OPEN.add(rid);TAB='cust';
    if(b.dataset.date)await saveMove(rid,{target_date:b.dataset.date},false);
    render();loadCand(rid);const r=D.reservations.find(x=>+x.rid===rid);const el=r&&$('c'+r.user_id);if(el)el.scrollIntoView({block:'start'});});
  v.querySelectorAll('button[data-ask]').forEach(b=>b.onclick=async()=>{
    const again=b.dataset.again==='1';
    if(again&&b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='한 번 더 누르면 새 글을 올립니다';return;}
    b.disabled=true;b.textContent='올리는 중…';
    try{const j=await api('requestChavis',{user_id:+b.dataset.ask,again});
      toast(`#caramel_팀장에 ${j.posted.length}건 올렸습니다${j.skipped.length?` (${j.skipped.length}건 빠짐)`:''}. 차비스 카드를 확인해 주세요`);}
    catch(e){toast('올리지 못했습니다: '+e.message);}
    await refresh(); // 응답이 끊겨도 서버에 남은 부탁 기록으로 다시 그린다(중복 부탁은 서버가 막음)
  });
  const f=$('stopf');
  if(f)f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);const o=Object.fromEntries(fd.entries());
    o.carry=fd.get('carry')==='on';o.rid=o.rid?+o.rid:null;o.car_temp=null;o.air_temp=o.air_temp===''?null:+o.air_temp;if(!o.new_date)delete o.new_date;
    try{const j=await api('addStop',{fields:o});D.stops.unshift(j.row);toast('기록했습니다');render();}catch(err){toast('저장 안 됨: '+err.message);}};
  v.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='한 번 더 누르면 지웁니다';return;}
    try{await api('deleteStop',{id:+b.dataset.del});D.stops=D.stops.filter(s=>+s.id!==+b.dataset.del);render();}catch(err){toast(err.message);}});
}
</script>
